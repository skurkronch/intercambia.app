<!-- Pegar en Supabase → Authentication → Emails, en "Magic link" y también en "Confirm signup".
     Asunto sugerido: Tu acceso a truXanger -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #121316; background: #f7f7f5;">
  <p style="font-size: 22px; font-weight: 700; margin: 0 0 24px;">tru<span style="color: #6c3ce9;">X</span>anger</p>
  <h1 style="font-size: 24px; line-height: 30px; margin: 0 0 12px;">Entra a truXanger</h1>
  <p style="font-size: 16px; line-height: 24px; margin: 0 0 24px;">Toca el botón para entrar. Funciona en cualquier navegador durante una hora.</p>
  <p style="margin: 0 0 28px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #6c3ce9; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none; padding: 14px 24px; border-radius: 14px; border-bottom: 4px solid #4b22b8;">
      Entrar a truXanger
    </a>
  </p>
  <p style="font-size: 16px; line-height: 24px; margin: 0 0 8px;">O escribe este código en la pantalla de entrar:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 0 0 28px;">{{ .Token }}</p>
  <p style="font-size: 13px; line-height: 18px; color: #5a5c63; margin: 0;">Si no pediste entrar, ignora este correo. Nadie puede entrar a tu cuenta sin este enlace o código.</p>
</div>
